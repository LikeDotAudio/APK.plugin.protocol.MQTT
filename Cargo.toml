[package]
workspace = "../.."
name = "apkaudio-mqtt"
version = "0.1.0"
edition.workspace = true

[dependencies]
apkaudio-contracts = { path = "../../contracts/rust" }

dashmap = { version = "5.5", optional = true }
# NOT optional. The topic-filter grammar in `router` is plain Rust and
# `self_test` reads it without an interpreter attached. PLAN-645.01.
regex = "1.10"
pyo3 = { version = "0.21.2", optional = true }

[features]
python = ["dep:pyo3", "dep:dashmap"]
