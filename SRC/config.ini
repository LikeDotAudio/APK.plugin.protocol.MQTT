# MQTT bus / broker configuration
# Published to MQTT (retained) by the orchestrator at: <topic>/config (+ /status, /host)
#
# TWO BROKERS, TWO KEYS, AND THE ORDER BETWEEN THEM.
#
# `host` is the broker THIS BENCH OWNS. It said `test.mosquitto.org` until
# 2026-08-29 (PLAN-35.03) — a public, unauthenticated server — and because this
# file is read by the orchestrator and by every protocol crate, that one line
# put the agent heartbeat and 21 protocol configs up there RETAINED, persisting
# with no process keeping them alive, readable by anyone. 27 discovered-device
# tables carrying hostnames, MAC addresses and 44.44.44.x addresses went the
# same way (PLAN-35.04). A public address under THIS key is still refused and
# said out loud — see `endpoints_from_ini` in the orchestrator's
# src/broker/select.rs.
#
# `public_host` is the broker this bench PUBLISHES TO FIRST, and it is a
# different sentence: the bench choosing to be visible from outside the
# building rather than a local address that turned out not to be one. The
# orchestrator probes it at boot and falls back to `host` when it does not
# answer, so an outage is loopback traffic rather than no traffic.
#
# WHAT THAT COSTS, because the earlier version of this comment said not to do
# it and the reason has not gone away: everything below the fold goes to a
# server anyone can subscribe to — protocol configs (hostnames, addresses,
# ports) and discovered-device tables, retained. This is now a decision with a
# name on it: it happens because this key is filled in, the orchestrator says
# so on every boot, and `--local-only` turns it off for a run. Host telemetry —
# this machine's CPU, RAM, load, uptime — is NOT included; that needs
# `--public-telemetry` as well.
#
# Delete `public_host` and the bench goes back to publishing only on the broker
# it owns, with no socket ever opened to a public one.
[mqtt]
enabled = true
host = 127.0.0.1
ws_port = 9001
tcp_port = 1883
# The public broker, tried first. Its websocket port is what the shell's
# read-only PUBLIC pane watches (DataBus/public-bus); its tcp port is where the
# Rust agents publish.
#
# WITHDRAWN 2026-08-29 (PLAN-35.04), on the owner's explicit call. A read-only
# inventory of test.mosquitto.org that day found 1,277 retained topics under
# APK.audio/#, 115 of them carrying an address, MAC or hostname, and 28 device
# tables back under System/Gui/Discovered/* — ConnectionMap (71,729 B, MAC+IP)
# and dnssd (64,011 B, MAC+hostname+IP) among them. They had been cleared once
# already and came back, because nothing gated the path that writes them:
# discovered.rs:1438 publishes each table with retain = true to whichever
# broker broker::select() returned, and with this key filled in that was the
# public one on every bare run. Clearing without withdrawing the key is undone
# within a second of the next boot.
#
# With the key commented out, endpoints_from_ini() (broker/select.rs) reads
# None, decide() returns Chosen::LocalUndeclared, and broker/choice.rs says so
# on the terminal. No socket is opened to a public broker. `--public-host` still
# reaches out for a single run, which is the point: it becomes an operator's
# typed decision rather than the shipped default.
#
# NOT CLOSED BY THIS LINE — four other public-first chains remain, and they
# account for most of the 1,277: rust.py:75 (PUBLIC_MQTT_BROKERS, public first
# and 127.0.0.1 last), FrontEnd/comMQTT/MqttProvider.jsx:275 (the browser pool,
# public primary — the Gui/Console/* and web-* topics), and TOUCH's two deploy
# workflows, which bake TWIST_MQTT_HOST = test.mosquitto.org into the shipped
# front end. Withdrawing those was deliberately left to the owner.
# public_host = test.mosquitto.org
public_tcp_port = 1883
public_ws_port = 8080
public_wss_port = 8081
# MQTT address this file is published to, RETAINED, as `<topic>/config` --
# and `<topic>/status`, `<topic>/host` beside it. The reader is the
# orchestrator, `Core/ORCHESTRATOR.hunter.VISA/src/mqtt.rs`, via
# `sect.get("topic")`. Nothing in this crate reads it.
topic = APK.audio/System/Protocols/mqtt

# NO topic_listen / topic_ignore / topic_publish HERE, and that is load-bearing:
# DataBus/ledger/bus-ledger.js reads those keys off the retained payload
# above and mount-db.js renders them as what this agent subscribes to.
#   This crate is a pyo3 shim; its subscribe calls take their topic as a
#   parameter from Python, never from this file.
# Declaring them made the shell state a falsehood. Add one back only when
# a named function in this crate loads it. See ../Cargo.toml, "The four
# topic keys, and who actually reads them".
